root = "."  # The root directory
tmp_dir = "tmp"  # The temporary directory where air will store its temporary files

[build]
bin = "main"  # The name of the binary file to be generated after building the project
cmd = "go build -o {{.Output}} {{.Input}}"  # The command to run the project

exclude = ["tmp/*", "client/*"]  # Specifies the directories to be excluded
include = ["**/*.go"]  # Specifies the files to include
ignore = ["tmp/*"]  # Additional ignore rules (optional)
